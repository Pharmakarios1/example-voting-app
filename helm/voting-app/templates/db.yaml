
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "voting-app.fullname" . }}-db-data
  labels:
    {{- include "voting-app.labels" . | nindent 4 }}
    app.kubernetes.io/component: db
spec:
  storageClassName: {{ .Values.db.storage.storageClassName | quote }}
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.db.storage.size }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "voting-app.fullname" . }}-db
  labels:
    {{- include "voting-app.labels" . | nindent 4 }}
    app.kubernetes.io/component: db
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "voting-app.selectorLabels" (dict "root" . "component" "db") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "voting-app.selectorLabels" (dict "root" . "component" "db") | nindent 8 }}
    spec:
      containers:
        - name: postgres
          image: "{{ .Values.db.image.repository }}:{{ .Values.db.image.tag }}"
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: {{ .Values.db.auth.username | quote }}
            - name: POSTGRES_PASSWORD
              value: {{ .Values.db.auth.password | quote }}
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: db-data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U "$POSTGRES_USER"
            initialDelaySeconds: 10
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: db-data
          persistentVolumeClaim:
            claimName: {{ include "voting-app.fullname" . }}-db-data
---
apiVersion: v1
kind: Service
metadata:
  name: db
  labels:
    {{- include "voting-app.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "voting-app.selectorLabels" (dict "root" . "component" "db") | nindent 4 }}
  ports:
    - name: postgres
      port: {{ .Values.db.service.port }}
      targetPort: postgres
