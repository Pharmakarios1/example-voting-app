
name: Voting App CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

env:
  DOCKERHUB_USERNAME: pharmakarios1

jobs:
  build-and-scan:
    name: Build and scan ${{ matrix.service }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        service: [vote, result, worker]

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build application image
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          load: ${{ github.event_name == 'pull_request' }}
          tags: pharmakarios1/voting-app-${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@0.33.1
        with:
          image-ref: pharmakarios1/voting-app-${{ matrix.service }}:${{ github.sha }}
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

  deploy-to-eks:
    name: Deploy to Amazon EKS
    needs: build-and-scan
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Configure kubectl for EKS
        run: |
          aws eks update-kubeconfig \
            --region "$AWS_REGION" \
            --name "$EKS_CLUSTER_NAME"
        env:
          AWS_REGION: ${{ secrets.AWS_REGION }}
          EKS_CLUSTER_NAME: ${{ secrets.EKS_CLUSTER_NAME }}

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Validate Helm chart
        run: |
          helm lint ./helm/voting-app
          helm template voting-app ./helm/voting-app \
            --set vote.image.tag="${GITHUB_SHA}" \
            --set result.image.tag="${GITHUB_SHA}" \
            --set worker.image.tag="${GITHUB_SHA}"

      - name: Deploy application with Helm
        run: |
          helm upgrade --install voting-app ./helm/voting-app \
            --namespace voting-app \
            --create-namespace \
            --wait \
            --timeout 5m \
            --set vote.image.repository="${DOCKERHUB_USERNAME}/voting-app-vote" \
            --set vote.image.tag="${GITHUB_SHA}" \
            --set result.image.repository="${DOCKERHUB_USERNAME}/voting-app-result" \
            --set result.image.tag="${GITHUB_SHA}" \
            --set worker.image.repository="${DOCKERHUB_USERNAME}/voting-app-worker" \
            --set worker.image.tag="${GITHUB_SHA}"
