
name: Voting App Build and Push

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: voting-app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    name: Build, scan and push ${{ matrix.service }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        service:
          - vote
          - result
          - worker

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image locally
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          load: true
          push: false
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/voting-app-${{ matrix.service }}:${{ github.sha }}
            ${{ secrets.DOCKER_USERNAME }}/voting-app-${{ matrix.service }}:latest
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ secrets.DOCKER_USERNAME }}/voting-app-${{ matrix.service }}:${{ github.sha }}
          format: table
          vuln-type: os,library
          severity: CRITICAL
          ignore-unfixed: false
          exit-code: '1'

      - name: Log in to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Push scanned image to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          IMAGE_SHA: ${{ github.sha }}
          SERVICE: ${{ matrix.service }}
        run: |
          IMAGE="${DOCKERHUB_USERNAME}/voting-app-${SERVICE}"

          docker push "${IMAGE}:${IMAGE_SHA}"
          docker push "${IMAGE}:latest"

  deploy-to-eks:
    name: Deploy to Amazon EKS
    runs-on: ubuntu-latest
    timeout-minutes: 20

    needs:
      - build-and-push

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Verify EKS access
        env:
          AWS_REGION: ${{ secrets.AWS_REGION }}
          EKS_CLUSTER_NAME: ${{ secrets.EKS_CLUSTER_NAME }}
        run: |
          aws sts get-caller-identity

          aws eks update-kubeconfig \
            --region "$AWS_REGION" \
            --name "$EKS_CLUSTER_NAME"

          kubectl get nodes

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Validate Helm chart
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          helm lint ./helm/voting-app

          helm template voting-app ./helm/voting-app \
            --set vote.image.repository="${DOCKERHUB_USERNAME}/voting-app-vote" \
            --set vote.image.tag="${IMAGE_TAG}" \
            --set result.image.repository="${DOCKERHUB_USERNAME}/voting-app-result" \
            --set result.image.tag="${IMAGE_TAG}" \
            --set worker.image.repository="${DOCKERHUB_USERNAME}/voting-app-worker" \
            --set worker.image.tag="${IMAGE_TAG}" \
            > /tmp/voting-app-rendered.yaml

          test -s /tmp/voting-app-rendered.yaml

      - name: Deploy application with Helm
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          helm upgrade --install voting-app ./helm/voting-app \
            --namespace voting-app \
            --create-namespace \
            --wait \
            --timeout 10m \
            --set vote.image.repository="${DOCKERHUB_USERNAME}/voting-app-vote" \
            --set vote.image.tag="${IMAGE_TAG}" \
            --set result.image.repository="${DOCKERHUB_USERNAME}/voting-app-result" \
            --set result.image.tag="${IMAGE_TAG}" \
            --set worker.image.repository="${DOCKERHUB_USERNAME}/voting-app-worker" \
            --set worker.image.tag="${IMAGE_TAG}"

      - name: Verify application rollout
        run: |
          kubectl rollout status deployment/voting-app-voting-app-vote \
            --namespace voting-app --timeout=180s

          kubectl rollout status deployment/voting-app-voting-app-result \
            --namespace voting-app --timeout=180s

          kubectl rollout status deployment/voting-app-voting-app-worker \
            --namespace voting-app --timeout=180s

          kubectl rollout status deployment/voting-app-voting-app-redis \
            --namespace voting-app --timeout=180s

          kubectl rollout status deployment/voting-app-voting-app-db \
            --namespace voting-app --timeout=180s

          kubectl get pods,services --namespace voting-app
